<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Scope pipeline: master JSON, select targets, validate, export to Burp">
  <title>Scope pipeline — master JSON → select → validate → export ▸ Burp</title>

  <defs>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#6E56CF" stop-opacity=".25"/>
      <stop offset="50%" stop-color="#8b74e8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#6E56CF" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".070"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".028"/>
    </linearGradient>
    <linearGradient id="panelOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E56CF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6E56CF" stop-opacity=".10"/>
    </linearGradient>
    <filter id="tok" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M60 138 H1140"/>
  </defs>

  <rect width="1200" height="230" rx="14" fill="#0e0b18"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <text x="46" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11.5" letter-spacing="3.6" fill="#a794f5">SCOPE PIPELINE</text>
  <text x="246" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11.5" letter-spacing="1.4" fill="#6b6289">one master file · many targets</text>

  <line x1="60" y1="138" x2="1140" y2="138" stroke="url(#rail)" stroke-width="2"/>
  <line x1="60" y1="138" x2="1140" y2="138" stroke="#8b74e8" stroke-width="2" stroke-opacity=".55"
        stroke-dasharray="8 14" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="44;0" dur="1.7s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#tok)">
    <circle r="5.5" fill="#b7a6ff">
      <animateMotion dur="6.4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
    </circle>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <!-- 01 MASTER JSON -->
    <g>
      <rect x="46" y="86" width="250" height="104" rx="16" fill="#0e0b18"/>
      <rect x="46" y="86" width="250" height="104" rx="16" fill="url(#panel)"/>
      <rect x="46" y="86" width="250" height="104" rx="16" fill="url(#panelOn)" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0;0" dur="6.4s" repeatCount="indefinite"/>
      </rect>
      <text x="70" y="114" font-size="10.5" letter-spacing="2.4" fill="#8b7fb8">01</text>
      <text x="70" y="140" font-size="16" font-weight="700" fill="#ffffff">MASTER JSON</text>
      <text x="70" y="162" font-size="11" fill="#7d7398">every target, one file</text>
    </g>

    <!-- 02 SELECT -->
    <g>
      <rect x="332" y="86" width="250" height="104" rx="16" fill="#0e0b18"/>
      <rect x="332" y="86" width="250" height="104" rx="16" fill="url(#panel)"/>
      <rect x="332" y="86" width="250" height="104" rx="16" fill="url(#panelOn)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" dur="6.4s" repeatCount="indefinite"/>
      </rect>
      <text x="356" y="114" font-size="10.5" letter-spacing="2.4" fill="#8b7fb8">02</text>
      <text x="356" y="140" font-size="16" font-weight="700" fill="#ffffff">SELECT</text>
      <text x="356" y="162" font-size="11" fill="#7d7398">pick only this job’s targets</text>
    </g>

    <!-- 03 VALIDATE -->
    <g>
      <rect x="618" y="86" width="250" height="104" rx="16" fill="#0e0b18"/>
      <rect x="618" y="86" width="250" height="104" rx="16" fill="url(#panel)"/>
      <rect x="618" y="86" width="250" height="104" rx="16" fill="url(#panelOn)" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0" dur="6.4s" repeatCount="indefinite"/>
      </rect>
      <text x="642" y="114" font-size="10.5" letter-spacing="2.4" fill="#8b7fb8">03</text>
      <text x="642" y="140" font-size="16" font-weight="700" fill="#ffffff">VALIDATE</text>
      <!-- color is reserved for status only — purple stays the single accent -->
      <g font-size="9.5" letter-spacing=".8">
        <rect x="642" y="152" width="50" height="17" rx="8.5" fill="#ff5470" fill-opacity=".16"/>
        <text x="652" y="164" fill="#ff8fa3">HIGH</text>
        <rect x="698" y="152" width="46" height="17" rx="8.5" fill="#ffb800" fill-opacity=".14"/>
        <text x="707" y="164" fill="#ffc94d">MED</text>
        <rect x="750" y="152" width="46" height="17" rx="8.5" fill="#78c8ff" fill-opacity=".12"/>
        <text x="759" y="164" fill="#8fd0ff">INFO</text>
      </g>
    </g>

    <!-- 04 EXPORT -->
    <g>
      <rect x="904" y="86" width="250" height="104" rx="16" fill="#0e0b18"/>
      <rect x="904" y="86" width="250" height="104" rx="16" fill="url(#panel)"/>
      <rect x="904" y="86" width="250" height="104" rx="16" fill="url(#panelOn)" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1" dur="6.4s" repeatCount="indefinite"/>
      </rect>
      <text x="928" y="114" font-size="10.5" letter-spacing="2.4" fill="#8b7fb8">04</text>
      <text x="928" y="140" font-size="16" font-weight="700" fill="#ffffff">EXPORT ▸ Burp</text>
      <text x="928" y="162" font-size="11" fill="#7d7398">as Burp project config</text>
    </g>
  </g>

  <text x="46" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="10.5" fill="#575070">INCLUDE / EXCLUDE share one schema — protocol · host (regex) · port · file path</text>
</svg>
